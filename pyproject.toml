[project]
name = "3d-characterisation-zircaloy4"
version = "0.1.0"
description = ""
authors = [
    {name = "lauragondu",email = "laura.gonzalez@postgrad.manchester.ac.uk"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter (>=1.1.1,<2.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "h5py (>=3.15.1,<4.0.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "scipy (>=1.17.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "3d_characterisation_zircaloy4", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
